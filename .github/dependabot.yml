version: 2

updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    groups:
      rust:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]

  # Base images and the Compose CLI in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
