[package]
name = "dinghy"
version = "0.1.0"
description = "A lightweight Docker Compose stack manager for a single server"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
base64 = "0.23.1"
bollard = "0.21.1"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
ring = "0.17.14"
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "process", "fs", "io-util", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
